# Per-slot CPUQuota= in the runner's user manager needs the cpu controller
# delegated to it; the org's own --cpus limit stays the ceiling above it.
# Each slot unit also sets Delegate=yes and runs its jobs in a runner-job child
# cgroup that it empties after every job (cgroup.kill); that works because the
# user manager owns this delegated subtree.
[Service]
Delegate=cpu cpuset io memory pids
